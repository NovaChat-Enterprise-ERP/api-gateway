services:
  - type: web
    name: novachat-api-gateway
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/api-gateway
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: novachat-shared
      - key: PORT
        value: 4000
      - key: AUTH_SERVICE_URL
        value: https://novachat-auth-service.onrender.com
      - key: WORKSPACE_SERVICE_URL
        value: https://novachat-workspace-service.onrender.com
      - key: MESSAGE_SERVICE_URL
        value: https://novachat-message-service.onrender.com
      - key: REALTIME_SERVICE_URL
        value: https://novachat-realtime-service.onrender.com
      - key: FILE_SERVICE_URL
        value: https://novachat-file-service.onrender.com
      - key: CALL_SERVICE_URL
        value: https://novachat-call-service.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://novachat-notification-service.onrender.com

  - type: web
    name: novachat-auth-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/auth-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - fromGroup: novachat-google
      - key: PORT
        value: 4001
      - key: BETTER_AUTH_SECRET
        generateValue: true

  - type: web
    name: novachat-workspace-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/workspace-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - key: PORT
        value: 4002
      - key: AUTH_SERVICE_URL
        value: https://novachat-auth-service.onrender.com

  - type: web
    name: novachat-message-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/message-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - key: PORT
        value: 4003
      - key: WORKSPACE_SERVICE_URL
        value: https://novachat-workspace-service.onrender.com

  - type: web
    name: novachat-realtime-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/realtime-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: novachat-shared
      - key: PORT
        value: 4004
      - key: WORKSPACE_SERVICE_URL
        value: https://novachat-workspace-service.onrender.com
      - key: MESSAGE_SERVICE_URL
        value: https://novachat-message-service.onrender.com

  - type: web
    name: novachat-file-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/file-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - fromGroup: novachat-storage
      - key: PORT
        value: 4005
      - key: MESSAGE_SERVICE_URL
        value: https://novachat-message-service.onrender.com
      - key: AWS_REGION
        value: us-east-2

  - type: web
    name: novachat-call-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/call-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - fromGroup: novachat-livekit
      - key: PORT
        value: 4006
      - key: MESSAGE_SERVICE_URL
        value: https://novachat-message-service.onrender.com

  - type: web
    name: novachat-notification-service
    runtime: docker
    plan: free
    repo: https://github.com/NovaChat-Enterprise-ERP/notification-service
    branch: main
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "node dist/db/migrate.js && exec node dist/server.js"
    envVars:
      - fromGroup: novachat-shared
      - fromGroup: novachat-db
      - fromGroup: novachat-resend
      - key: PORT
        value: 4007
      - key: WORKSPACE_SERVICE_URL
        value: https://novachat-workspace-service.onrender.com
      - key: MESSAGE_SERVICE_URL
        value: https://novachat-message-service.onrender.com
